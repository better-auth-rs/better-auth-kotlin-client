name: CI and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: ./gradlew --no-daemon check publishToMavenLocal

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/master
          version=$(awk -F= '$1 == "version" { print $2 }' gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$version"
      - name: Build and verify JitPack artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          artifact=better-auth-kotlin-client
          base="https://jitpack.io/com/github/better-auth-rs/$artifact/$RELEASE_TAG"
          curl --fail --show-error --location --max-time 1200 "$base/$artifact-$RELEASE_TAG.pom" --output "$RUNNER_TEMP/sdk.pom"
          curl --fail --show-error --location --max-time 120 "$base/$artifact-$RELEASE_TAG.jar" --output "$RUNNER_TEMP/sdk.jar"
          curl --fail --show-error --location --max-time 30 "https://jitpack.io/api/builds/com.github.better-auth-rs/$artifact/$RELEASE_TAG" --output "$RUNNER_TEMP/jitpack.json"
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path
          from xml.etree import ElementTree

          directory = Path(os.environ["RUNNER_TEMP"])
          status = json.loads((directory / "jitpack.json").read_text())
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert status["status"] == "ok", status
          assert status["commit"] == commit, status
          pom = ElementTree.parse(directory / "sdk.pom").getroot()
          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          assert pom.findtext("m:groupId", namespaces=namespace) == "com.github.better-auth-rs"
          assert pom.findtext("m:artifactId", namespaces=namespace) == "better-auth-kotlin-client"
          assert pom.findtext("m:version", namespaces=namespace) == os.environ["RELEASE_TAG"]
          with zipfile.ZipFile(directory / "sdk.jar") as jar:
              assert jar.testzip() is None
              assert "io/github/betterauth/client/BetterAuthClient.class" in jar.namelist()
          print("Verified JitPack coordinates, commit, and client JAR.")
          PYTHON
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
